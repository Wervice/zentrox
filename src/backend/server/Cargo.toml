[package]
name = "zentrox"
version = "0.1.1"
edition = "2024"
authors = ["Wervice <wervice@proton.me>"]
description = "An open source home lab device frontend to administrate your devices"
documentation = "https://github.com/Wervice/zentrox/wiki"
homepage = "https://wervice.github.io/zentrox"
license = "Apache-2.0"
keywords = ["administration", "actix", "remote"]
repository = "https://github.com/Wervice/zentrox"

[dependencies]
utils = { path = "../utils/" }
api = { path = "../../api/" }
actix-cors = "0.7.0"
actix-multipart = "0.7.2"
actix-session = { version = "0.10.0", features = ["cookie-session"] }
actix-web = { version = "4.14.0", features = ["rustls-0_23"] }
actix-governor = "0.8.0"
rustls = "0.23.18"
rustls-pemfile = "2"
dirs = "5.0.1"
hex = "0.4.3"
rand = "0.8.5"
rcgen = "0.13.1"
regex = "1.10.6"
rpassword = "7.3.1"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.127"
tokio = "1.47.1"
totp-rs = "5.6.0"
whoami = { version = "1.5.1", default-features = false }
uuid = { version = "1.11.0", features = ["v4"]}
Inflector = "0.11.4"
rusqlite = { version = "0.32.0", features = ["bundled"], default-features = false }
sysinfo = "0.34.2"
log = "0.4.27"
diesel = { version = "2.2.12", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "r2d2", "chrono"] }
utoipa = { version = "5.4.0", features = ["macros"] }
simplelog = "0.12.2"
argon2 = "0.5.3"
thiserror = "2.0.17"
qr2term = "0.3.3"
bollard = { version = "0.20.1", default-features = false, features = ["pipe"] }
dhat = "0.3.3"
erased-serde = "0.4.10"
rust-embed = { version = "8.12.0", features = ["actix", "compression", "deterministic-timestamps"] }
mime_guess = "2.0.5"
chrono = "*"

[profile.release]
opt-level = 3
debug = 0
